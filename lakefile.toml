name = "RequestProject"
defaultTargets = ["RequestProject"]

[[require]]
name = "Hammer"
git = "https://github.com/JOSHCLUNE/LeanHammer"
rev = "main" # Replace this with `rev = "v4.XX.X"` to add LeanHammer for an earlier supported Lean version.


[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc2"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "21998bb6196b56789f72a52656a781a75e134eb0"

# Sam's local clone of the Zeta23 artifact (anthropics/zeta-23-lean, Apache 2.0):
# "More than two thirds of the zeros of the Riemann zeta function lie on the
# critical line".  Path require against the user-obtained working copy.
[[require]]
name = "Zeta23"
path = "../zeta-23-lean"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]
